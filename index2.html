
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Return Gift</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="top">A LITTLE SURPRISE FOR YOU</div>

        <h1>Thank You! 🎂</h1>

        <p class="intro">
            Mujhe birthday wish karne ke liye thank you!
            <br>
            Apna naam likho aur kholo apna
            <b>Special Return Gift</b> 🎁
        </p>

        <section class="card">

            <div class="emoji">🎁</div>

            <label for="guestName">
                Apna naam yahan likhein
            </label>

            <input
                type="text"
                id="guestName"
                placeholder="e.g. Rahul"
            >

            <br>

            <button id="giftButton">
                Mera Gift Kholo ✨
            </button>

            <div id="result">

                <div id="giftIcon">🎉</div>

                <h2 id="giftTitle">
                    Your Funny Gift!
                </h2>

                <p id="giftText"></p>

            </div>

            <div class="small">
                Warning: Is gift ko dekhkar hasi aa sakti hai! 😄
            </div>

        </section>

        <div class="footer">
            Made with ❤️ • Birthday Return Gift
        </div>

    </main>

    <script src="first.js"></script>

</body>
</html>
